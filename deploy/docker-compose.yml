# docker compose -f deploy/docker-compose.yml up -d   (run from the repo root, with ./certs/ca.crt and ca.key present)
services:
  pixelserv-tls:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pixelserv-tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../certs:/var/cache/pixelserv
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true
