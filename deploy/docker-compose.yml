# docker compose -f deploy/docker-compose.yml up -d --build   (run from the repo root)
# ./certs must contain ca.crt and ca.key and be owned by uid 65534: chown -R 65534:65534 certs
services:
  pixelserv-tls:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pixelserv-tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../certs:/var/cache/pixelserv
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true
