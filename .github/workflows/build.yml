name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libssl-dev curl openssl
      - name: Build
        run: autoreconf -i && ./configure && make
      - name: Smoke test
        run: sudo bash tests/smoke.sh ./pixelserv-tls
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libssl-dev curl openssl python3
      - name: Build with ASan and UBSan
        run: |
          autoreconf -i && ./configure
          make EXTRA_CFLAGS="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer" EXTRA_LDFLAGS="-fsanitize=address,undefined"
      - name: Smoke test and malformed-request fuzz
        run: sudo env ASAN_OPTIONS=detect_leaks=0 bash tests/smoke.sh ./pixelserv-tls && sudo env ASAN_OPTIONS=detect_leaks=0 bash tests/fuzz.sh ./pixelserv-tls
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64, arm64 (Pi 4/5) and armv7 (Pi 2/3 32-bit); push image from master
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/${{ github.repository }}:latest
